<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Кулинарная книга</title><style>
:root{--bg:#f8f1e7;--card:#fffdf8;--ink:#4a3f35;--mut:#8a7a6a;--acc:#c96f4a;--soft:#f3e7d8;--softink:#7a5c3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Segoe UI',Arial,sans-serif}
header{max-width:1200px;margin:0 auto;padding:34px 20px 6px;text-align:center}
h1{font-family:Georgia,'Times New Roman',serif;font-size:44px;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--mut);margin:0}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 10px}
.chip{border:1px solid #e3d5c3;background:var(--card);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:15px;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.topbtn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:999px;padding:8px 20px;cursor:pointer;font-size:15px;margin-top:8px}
.topbtn:hover{background:var(--acc);color:#fff}
.grid{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(90,60,30,.08);display:flex;flex-direction:column}
.ph{position:relative;height:190px;background:#efe3d2;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phfall{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:64px}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody h3{font-family:Georgia,serif;font-size:22px;margin:0;line-height:1.25}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;background:var(--soft);color:var(--softink);border-radius:999px;padding:4px 10px;white-space:nowrap}
.kline{font-size:13px;color:var(--mut)}
.cbtns{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;background:var(--soft);color:var(--softink)}
.btn.acc{background:var(--acc);color:#fff}
.btn:hover{filter:brightness(.96)}
.modal{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;z-index:50}
.modal.show{display:flex}
.panel{background:var(--card);border-radius:18px;max-width:1080px;width:100%;padding:28px 32px;position:relative;box-shadow:0 20px 60px rgba(60,30,10,.25)}
.close{position:absolute;top:14px;right:16px;border:0;background:none;font-size:28px;cursor:pointer;color:#a08b73;line-height:1}
.mtitle{font-family:Georgia,serif;font-size:32px;margin:0 0 12px}
.mphoto{width:100%;height:300px;object-fit:cover;border-radius:14px;background:#efe3d2;margin-bottom:6px}
.pt{font-family:Georgia,serif;font-size:19px;margin:18px 0 6px;color:var(--acc)}
.ing{display:flex;justify-content:space-between;gap:14px;border-bottom:1px dashed #ead9c4;padding:5px 2px}
.iqty{white-space:nowrap;color:var(--softink)}
.kb{background:#eef4ea;border:1px solid #d8e6cf;border-radius:12px;padding:12px 16px;margin:14px 0}
.kbttl{font-size:13px;color:#5a6b4a;margin-bottom:6px}
table.kbt{width:100%;border-collapse:collapse;font-size:14px}
.kbt td{padding:3px 10px 3px 0}
.kbnote{font-size:12px;color:#5a6b4a;margin-top:6px}
.calc{background:#fbf3e6;border:1px solid #ecdcc4;border-radius:12px;padding:12px 16px;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mul{border:1px solid #e3d5c3;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px}
.mul.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=number]{border:1px solid #e3d5c3;border-radius:8px;padding:7px 10px;width:95px;font-size:15px}
.hint{font-size:13px;color:var(--mut)}
.steps{margin:8px 0 0;padding-left:22px}
.steps li{margin:8px 0}
.mhead{font-family:Georgia,serif;font-size:24px;margin:20px 0 4px}
#printArea{display:none}
#probe{position:fixed;left:-3000px;top:0;visibility:hidden}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 body{background:#fff}
 @page{size:A5;margin:0}
 .sheet{width:148mm;height:210mm;box-sizing:border-box;position:relative;overflow:hidden;page-break-after:always;background:#fff;padding:10mm 10mm 10mm 24mm}
 .sbody{height:100%;overflow:hidden;font-size:10.5pt;line-height:1.45;color:#222}
 .sheet h2{font-family:Georgia,serif;font-size:15pt;margin:0 0 2mm;color:#222}
 .sheet .meta{color:#666;font-size:9pt;margin-bottom:1.5mm}
 .sheet .pt{font-size:10.5pt;font-weight:bold;margin:3mm 0 1mm;color:#8a5a2b}
 .sheet .pt.cont{color:#999}
 .sheet .ing{border-bottom:1px dotted #bbb;padding:1mm 0;font-size:10pt}
 .sheet .st{margin:1.5mm 0}
 .hole{position:absolute;left:9mm;width:6mm;height:6mm;border:1.2px solid #999;border-radius:50%;background:#fff}
}

(function(){
const DATA=;
const CATS=[["Все","🍽️"],["Завтраки","🥞"],["Закуски","🧀"],["Основные блюда","🍗"],["Выпечка","🥖"],["Десерты","🍰"],["Заготовки","🫙"]];
let curCat="Все";
const grid=document.getElementById("grid");
const chips=document.getElementById("chips");
const modal=document.getElementById("modal");
const panel=document.getElementById("panel");
const printArea=document.getElementById("printArea");
let probe=null;
let state=null;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtNum(x){if(Math.abs(x-Math.round(x))<0.06)return String(Math.round(x));return String(Math.round(x*10)/10).replace(".",",")}
function fmtQty(q,f){const s=q*f;if(Math.abs(s-0.5)<0.06)return "½";if(Math.abs(s-0.25)<0.06)return "¼";if(Math.abs(s-0.75)<0.06)return "¾";return fmtNum(s)}
function ingLine(it,f){const q=it[1],u=it[2];let qs=(q===null)?u:(fmtQty(q,f)+" "+u);
 return '<div class="ing"><span class="iname">'+esc(it[0])+'</span><span class="iqty">'+qs+'</span></div>'}
function partsHtml(r,f){return r.parts.map(function(p){
 return (p.t?'<div class="pt">'+esc(p.t)+'</div>':'')+p.items.map(function(it){return ingLine(it,f)}).join("")
}).join("")}
function kbInner(r,f){
 return '<div class="kbttl">Примерный расчёт: по сырым ингредиентам с учётом уварки/выпаривания</div>'+
 '<table class="kbt"><tr><td>на 100 г</td><td>≈'+r.kb.k100+' ккал</td><td>Б '+r.kb.p100+'</td><td>Ж '+r.kb.f100+'</td><td>У '+r.kb.c100+'</td></tr>'+
 '<tr><td>на порцию</td><td>≈'+Math.round(r.kb.tot/r.servings)+' ккал</td><td>Б '+Math.round(r.kb.tp/r.servings)+'</td><td>Ж '+Math.round(r.kb.tf/r.servings)+'</td><td>У '+Math.round(r.kb.tc/r.servings)+'</td></tr>'+
 '<tr><td>на всё блюдо</td><td>≈'+Math.round(r.kb.tot*f)+' ккал</td><td>Б '+Math.round(r.kb.tp*f)+'</td><td>Ж '+Math.round(r.kb.tf*f)+'</td><td>У '+Math.round(r.kb.tc*f)+'</td></tr></table>'+
 '<div class="kbnote">Готовый вес блюда ≈ '+fmtNum(r.kb.ready*f)+' г</div>'}
function kbBlock(r,f){return '<div class="kb" id="mkb">'+kbInner(r,f)+'</div>'}

function render(){
 const list=DATA.filter(function(r){return curCat==="Все"||r.cat===curCat});
 grid.innerHTML=list.map(cardHtml).join("");
}
function cardHtml(r){
 const partsTxt=r.parts.length>1?r.parts.length+" частей":"базовый рецепт";
 return '<article class="card" data-cat="'+r.cat+'">'+
 '<div class="ph"><img src="img/'+r.img+'" alt="'+esc(r.name)+'"><div class="phfall">'+r.icon+'</div></div>'+
 '<div class="cbody"><h3>'+esc(r.name)+'</h3>'+
 '<div class="badges"><span class="badge">'+r.icon+' '+r.cat+'</span><span class="badge">⏱ '+r.time+'</span><span class="badge">'+partsTxt+'</span></div>'+
 '<div class="kline">≈'+r.kb.k100+' ккал/100 г · порция ≈'+Math.round(r.kb.tot/r.servings)+' ккал</div>'+
 '<div class="cbtns"><button class="btn acc" data-act="open" data-id="'+r.id+'">Открыть полностью</button>'+
 '<button class="btn" data-act="printone" data-id="'+r.id+'">Распечатать рецепт</button></div></div></article>';
}
function chipsRender(){
 chips.innerHTML=CATS.map(function(c){return '<button class="chip'+(c[0]===curCat?" on":"")+'" data-cat="'+c[0]+'">'+c[1]+' '+c[0]+'</button>'}).join("");
}
chips.addEventListener("click",function(e){
 const c=e.target.closest(".chip");if(!c)return;curCat=c.dataset.cat;chipsRender();render();
});

function R(){return DATA.find(function(x){return x.id===state.id})}
function openModal(id){state={id:id,factor:1};renderModal();modal.classList.add("show");document.body.style.overflow="hidden"}
function closeModal(){modal.classList.remove("show");document.body.style.overflow="";state=null}
function calcHtml(r){
 return '<div class="calc"><div class="crow"><span>Порции:</span>'+
 '<button class="mul" data-mul="0.5">½</button><button class="mul on" data-mul="1">1</button>'+
 '<button class="mul" data-mul="2">2</button><button class="mul" data-mul="3">3</button>'+
 '<button class="mul" data-mul="4">4</button>'+
 '<input id="pInp" type="number" step="0.5" min="0.5" value="'+r.servings+'"><span>порций</span></div>'+
 '<div class="crow"><label for="gInp">Готовый вес, г:</label><input id="gInp" type="number" min="1" step="10" value="'+Math.round(r.kb.ready)+'">'+
 '<span class="hint">базово ≈ '+fmtNum(r.kb.ready)+' г — пересчитает все ингредиенты</span></div></div>';
}
function renderModal(){
 const r=R();
 panel.innerHTML='<button class="close" data-act="close">×</button>'+
 '<h2 class="mtitle">'+esc(r.name)+'</h2>'+
 '<div class="badges"><span class="badge">'+r.icon+' '+r.cat+'</span><span class="badge">⏱ '+r.time+'</span><span class="badge">'+(r.parts.length>1?r.parts.length+" частей":"базовый рецепт")+'</span></div>'+
 '<img class="mphoto" src="img/'+r.img+'" alt="">'+
 calcHtml(r)+kbBlock(r,1)+
 '<div class="mhead">Ингредиенты</div><div id="mings">'+partsHtml(r,1)+'</div>'+
 '<div class="mhead">Приготовление</div><ol class="steps">'+r.steps.map(function(s){return "<li>"+esc(s)+"</li>"}).join("")+'</ol>'+
 '<div class="cbtns"><button class="btn acc" data-act="printone" data-id="'+r.id+'">Распечатать рецепт</button></div>';
 const p=document.getElementById("pInp"),g=document.getElementById("gInp");
 p.addEventListener("input",function(){const v=parseFloat(p.value);if(!v||v<0.5)return;state.factor=v/r.servings;
  g.value=Math.round(r.kb.ready*state.factor);updateLists()});
 g.addEventListener("input",function(){const v=parseFloat(g.value);if(!v||v<1)return;state.factor=v/r.kb.ready;
  p.value=Math.round(r.servings*state.factor*10)/10;updateLists()});
}
function updateLists(){
 const r=R();document.getElementById("mings").innerHTML=partsHtml(r,state.factor);
 document.getElementById("mkb").innerHTML=kbInner(r,state.factor);
}
function setMul(m){
 state.factor=m;
 panel.querySelectorAll(".mul").forEach(function(b){b.classList.toggle("on",Math.abs(parseFloat(b.dataset.mul)-m)<0.001)});
 const r=R();
 document.getElementById("pInp").value=Math.round(r.servings*m*10)/10;
 document.getElementById("gInp").value=Math.round(r.kb.ready*m);
 updateLists();
}

function newSheet(){
 const s=document.createElement("div");s.className="sheet";
 s.innerHTML='<div class="hole" style="top:24.5mm"></div><div class="hole" style="top:69.5mm"></div>'+
 '<div class="hole" style="top:134.5mm"></div><div class="hole" style="top:179.5mm"></div><div class="sbody"></div>';
 return s;
}
function getProbe(){if(!probe){probe=document.createElement("div");probe.id="probe";document.body.appendChild(probe)}return probe}
function buildSheets(r,f){
 const blocks=[];
 blocks.push('<div class="shead"><h2>'+esc(r.name)+'</h2>'+
 '<div class="meta">'+r.icon+' '+r.cat+' · ⏱ '+r.time+' · порций: '+fmtNum(r.servings*f)+'</div>'+
 '<div class="meta">КБЖУ (примерно): ≈'+r.kb.k100+' ккал/100 г · порция ≈'+Math.round(r.kb.tot/r.servings)+
 ' ккал · всё блюдо ≈'+Math.round(r.kb.tot*f)+' ккал · готовый вес ≈ '+fmtNum(r.kb.ready*f)+' г</div></div>');
 r.parts.forEach(function(p){
  if(p.t)blocks.push('<div class="pt">'+esc(p.t)+'</div>');
  p.items.forEach(function(it){blocks.push(ingLine(it,f))});
 });
 r.steps.forEach(function(s,i){blocks.push('<div class="st"><b>'+(i+1)+'.</b> '+esc(s)+'</div>')});
 const out=[];
 const pr=getProbe();
 let sheet=newSheet();pr.appendChild(sheet);
 let body=sheet.querySelector(".sbody");
 body.insertAdjacentHTML("beforeend",blocks[0]);
 for(let i=1;i<blocks.length;i++){
  body.insertAdjacentHTML("beforeend",blocks[i]);
  if(body.scrollHeight>body.clientHeight+2&&body.children.length>2){
   body.lastElementChild.remove();
   out.push(sheet);
   sheet=newSheet();pr.appendChild(sheet);
   body=sheet.querySelector(".sbody");
   body.insertAdjacentHTML("beforeend",'<div class="pt cont">«'+esc(r.name)+'» — продолжение</div>');
   body.insertAdjacentHTML("beforeend",blocks[i]);
  }
 }
 out.push(sheet);
 return out;
}
function doPrint(sheets){
 printArea.innerHTML="";
 sheets.forEach(function(s){printArea.appendChild(s)});
 window.print();
}

document.addEventListener("click",function(e){
 const m=e.target.closest("[data-mul]");
 if(m&&state){setMul(parseFloat(m.dataset.mul));return}
 const t=e.target.closest("[data-act]");
 if(!t)return;
 const act=t.dataset.act;
 if(act==="open")openModal(parseInt(t.dataset.id,10));
 else if(act==="close")closeModal();
 else if(act==="printone"){const id=parseInt(t.dataset.id,10);const r=DATA.find(function(x){return x.id===id});
  doPrint(buildSheets(r,state&&state.id===id?state.factor:1))}
 else if(act==="printbook"){const all=[];DATA.forEach(function(r){all.push.apply(all,buildSheets(r,1))});doPrint(all)}
});
