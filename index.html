<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<title>Моя кулинарная книга</title>
<style>
:root{
  --bg:#f4f1ea; --paper:#fdfbf5; --ink:#332b24; --muted:#6f655a;
  --sage:#73856e; --sage-dark:#55664f; --gold:#a3814e; --terra:#b36c5f;
  --line:#ded8ca;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;font-size:18px;
  background-image:
    radial-gradient(circle at 8% 12%, #ebe7dc 0%, transparent 45%),
    radial-gradient(circle at 92% 85%, #ebe6d9 0%, transparent 40%);
  background-attachment:fixed}
header,main{max-width:1100px;margin:auto;padding:0 24px}
header{padding-top:70px;text-align:center}
header small{color:var(--sage-dark);text-transform:uppercase;letter-spacing:.28em;font-weight:600;font-size:14px;font-family:Arial,sans-serif}
h1{font-family:Georgia,serif;font-size:clamp(42px,6vw,64px);font-weight:700;margin:18px 0 4px;color:#2b241d}
.ornament{color:var(--gold);font-size:20px;letter-spacing:.6em;margin:6px 0 10px}
header p{color:var(--muted);font-size:20px;font-style:italic;max-width:540px;margin:0 auto}

.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:44px 0 22px}
.tools input{background:#fffdf8;border:1px solid var(--line);border-radius:14px;
  padding:14px 18px;flex:1;min-width:220px;font:inherit;font-size:17px;color:var(--ink)}
.tools input:focus{outline:none;border-color:var(--sage)}
.filters{display:flex;gap:9px;overflow-x:auto;padding:0 0 22px}
.filter{border:1px solid #cfd6ca;border-radius:100px;background:transparent;
  padding:10px 19px;white-space:nowrap;color:#4e5c4a;font-size:16px;font-family:Arial,sans-serif;cursor:pointer;transition:all .2s}
.filter:hover{border-color:var(--sage);color:var(--sage-dark)}
.filter.active{background:var(--sage);color:#fff;border-color:var(--sage)}
.count{font-size:16px;color:var(--muted);margin:0 0 22px}
.count b{font-weight:700;color:#4b443b}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:90px}
.recipe{border:1px solid var(--line);background:var(--paper);border-radius:16px;
  padding:18px 22px 20px;min-height:200px;text-align:left;display:flex;flex-direction:column;
  cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;
  font:inherit;color:inherit}
.recipe::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--sage) 0%,var(--gold) 50%,var(--sage) 100%);opacity:.6;z-index:1}
.recipe:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(60,53,46,.12)}
.card-photo{height:72px;border-radius:10px;overflow:hidden;background:#f4ecd9;margin-bottom:12px}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-photo.no-photo{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eee9dc,#e3e8dc);color:#829078;font-size:30px}
.detail-photo.no-photo{height:52px;display:flex;align-items:center;justify-content:center;background:#f1eee4;color:#829078;font-size:24px;border-radius:12px;margin:14px 0}
.recipe .cat{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--sage-dark);font-weight:700}
.recipe h2{font-family:Georgia,serif;font-size:24px;line-height:1.25;font-weight:700;margin:8px 0 6px;color:#2b241d}
.recipe p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 14px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;
  font-size:15px;color:var(--sage-dark);border-top:1px dashed var(--line);padding-top:12px}
.heart{color:#9caaa0;font-size:23px;padding:2px 6px}
.heart:hover,.heart.on{color:var(--terra)}
.empty{padding:40px;color:var(--muted);font-style:italic;grid-column:1/-1;text-align:center}

dialog{border:0;border-radius:20px;width:min(1240px,calc(100% - 24px));max-height:92dvh;
  padding:0;background:var(--paper);color:var(--ink);box-shadow:0 30px 90px rgba(40,34,26,.35)}
dialog::backdrop{background:#2a2620b0}
.detail{padding:42px 64px 48px;max-width:1240px;margin:auto}
.detail-photo{margin:2px 0 14px;border-radius:14px;overflow:hidden;max-height:260px}
.detail-photo img{width:100%;height:260px;object-fit:cover;display:block}
.detail .tag{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.detail h2{font:700 38px Georgia,serif;margin:8px 0 4px;color:#2b241d}
.detail .meta-line{color:var(--sage-dark);font-size:17px;margin-bottom:8px}
.detail .intro{color:var(--muted);font-style:italic;font-size:18px;margin:4px 0 2px}
.portion-row{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:17px;color:var(--muted);flex-wrap:wrap}
.pbtn{border:1.5px solid var(--sage);background:transparent;color:var(--sage-dark);
  border-radius:50%;width:38px;height:38px;font-family:Georgia,serif;font-size:15px;cursor:pointer;transition:all .15s}
.pbtn:hover{background:#eef0ea}
.pbtn.active{background:var(--sage);color:#fff}
.detail h3{font:700 24px Georgia,serif;margin:26px 0 6px;color:#2b241d;display:flex;align-items:center;gap:12px}
.detail h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.detail ul{list-style:none;padding:0;margin:14px 0 0;columns:2;column-gap:40px}
.detail li{padding:10px 0;border-bottom:1px dotted var(--line);line-height:1.5;font-size:17px;break-inside:avoid}
.detail ol{margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.detail ol li{counter-increment:s;position:relative;padding:11px 0 11px 46px;line-height:1.55;font-size:17px}
.detail ol li::before{content:counter(s);position:absolute;left:0;top:12px;width:28px;height:28px;
  border:1.5px solid var(--sage);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--sage-dark);font-weight:700}
.detail-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.close{border:1px solid var(--line);background:#f2efe6;border-radius:50%;width:42px;height:42px;
  font-size:24px;flex-shrink:0;color:#6a6156;cursor:pointer}
.close:hover{background:var(--sage);color:#fff;border-color:var(--sage)}
.btns{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn-full{background:var(--sage-dark);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:17px;font-family:Georgia,serif;cursor:pointer}
.btn-full:hover{background:#46563f}
.btn-print{background:transparent;color:var(--sage-dark);border:1.5px solid var(--sage);
  border-radius:12px;padding:14px 28px;font-size:17px;font-family:Georgia,serif;cursor:pointer}
.btn-print:hover{background:var(--sage);color:#fff}

/* ---------- экран предпросмотра листа ---------- */
#printView{display:none}
#printView.visible{display:block;position:fixed;inset:0;background:#e9e5da;overflow:auto;z-index:50;padding:34px 10px}
.sheet{width:148mm;min-height:210mm;margin:0 auto;background:#fdf8ee;position:relative;
  padding:9mm 9mm 9mm 20mm;box-shadow:0 12px 40px rgba(40,34,26,.28)}
.hole{position:absolute;left:9mm;width:6mm;height:6mm;border-radius:50%;
  border:1.4px solid #b9a983;background:#e9e5da;box-shadow:inset 0 1.5px 3px rgba(0,0,0,.3)}
.frame{border:1.4px solid #c9b896;padding:7mm 7mm 6mm;position:relative}
.corner{position:absolute;color:var(--gold);font-size:12pt}
.c-tl{top:2mm;left:3mm}.c-tr{top:2mm;right:3mm}.c-bl{bottom:2mm;left:3mm}.c-br{bottom:2mm;right:3mm}
.kicker{text-align:center;font-family:Arial,sans-serif;font-size:10px;letter-spacing:.32em;
  text-transform:uppercase;color:#6f655a}
.deco{text-align:center;color:var(--gold);font-size:13px;letter-spacing:.5em;margin:2mm 0}
.sheet-title{text-align:center;font-family:Georgia,serif;font-weight:700;font-size:24pt;color:#4a3c2a;margin:1mm 0 2mm}
.meta{display:flex;justify-content:center;gap:5mm;font-size:10pt;color:#6f655a;font-family:Arial,sans-serif;
  border-top:1px solid #c9b896;border-bottom:1px solid #c9b896;padding:2.5mm 0;margin-bottom:5mm;flex-wrap:wrap}
.meta.small{border:none;padding:0;font-size:9pt;margin-bottom:3mm}
.cont-mark{font-size:12pt;color:#a3814e;font-style:italic;font-weight:normal}
.cols{display:flex;gap:6mm;align-items:flex-start}
.ingcol{flex:1}
.photo{width:48mm;flex-shrink:0;transform:rotate(2deg);background:#fff;
  padding:2mm 2mm 5mm;box-shadow:0 1mm 2.5mm rgba(0,0,0,.18);position:relative}
.photo .tape{position:absolute;top:-4mm;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:26mm;height:8mm;background:rgba(222,209,180,.8)}
.photo img{width:100%;height:52mm;object-fit:cover;display:block}
.photo .ph{width:100%;height:52mm;background:#f4ecd9;border:1px dashed #c9b896;
  display:flex;align-items:center;justify-content:center;color:#b9a983;font-size:20pt}
.sec{font-family:Georgia,serif;font-weight:700;font-size:13pt;color:#4a3c2a;margin:4mm 0 2mm;
  border-bottom:1px solid #c9b896;padding-bottom:1.2mm}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;gap:2.5mm;font-size:10.5pt;padding:1.4mm 0;border-bottom:1px dotted #ddd3bf;align-items:flex-start}
ul.ing .box{width:3.2mm;height:3.2mm;border:1.2px solid #7a6b52;border-radius:.6mm;flex-shrink:0;margin-top:1mm}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:1mm 0 1.5mm 10mm;min-height:8mm;margin-bottom:2.2mm;
  font-size:10.5pt;line-height:1.5}
ol.steps li::before{content:counter(s);position:absolute;left:.6mm;top:.9mm;width:6mm;height:6mm;box-sizing:border-box;
  border:1.2px solid #7a6b52;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9pt;color:#4d4030;font-weight:700;background:#faf6ec}
.notes{margin-top:5mm;border:1px solid #c9b896;border-radius:2mm;padding:2.5mm 3mm;min-height:37mm;box-sizing:border-box;
  background:linear-gradient(#fbf6ea,#fbf6ea)}
.notes b{font-family:Georgia,serif;font-size:9pt;color:#4a3c2a;display:block;margin-bottom:1mm}
.notes .note-text{font-family:Arial,sans-serif;font-size:7.2pt;line-height:1.3;color:#766b59;margin:0 0 2mm}
.notes .write-area{height:19mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5.5mm,#e5dcc9 5.5mm,#e5dcc9 5.7mm)}
.printbar{display:flex;gap:10px;justify-content:center;margin:0 0 18px;position:sticky;top:0;z-index:5}
.printbar button{background:#3d3120;color:#fff;border:0;border-radius:12px;padding:13px 28px;
  font:inherit;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.printbar .ghost{background:#fffdf8;color:#3d3120;border:1px solid #d5cbb8}

@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.detail ul{columns:1}}
@media(max-width:560px){
  .detail{padding:26px 20px 30px}
  header{padding-top:44px}
  .grid{grid-template-columns:1fr;gap:14px}
  .recipe{min-height:170px;padding:20px}
  .tools{margin-top:30px}
  .detail{padding:26px 22px}
}
.ingredient-heading{list-style:none;margin:15px 0 6px;color:#55664f;font-weight:700;border-bottom:1px solid #ded8ca;padding:5px 0}

.detail h2{font-size:clamp(32px,4vw,46px);line-height:1.12;margin:8px 0 12px}
.recipe-notes{margin-top:26px;padding:14px 18px 16px;background:#f0f0e8;border:1px solid #d8ddcf;border-radius:12px}.recipe-notes h3{margin:0 0 7px;font-size:16px}.recipe-notes p{font-family:Arial,sans-serif;font-size:13px;line-height:1.45;margin:0 0 12px;color:#766b59}.recipe-notes .write-area{height:88px;border-radius:3px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#d8ddcf 27px,#d8ddcf 28px)}
.detail h3{font-size:23px;color:var(--sage-dark);border-bottom:1px solid var(--line);padding-bottom:8px;margin:28px 0 12px}
.detail ul{padding-left:0;list-style:none;columns:2;column-gap:42px}
.detail ul li{break-inside:avoid;padding:7px 10px;border-bottom:1px dotted var(--line);font-family:Arial,sans-serif;font-size:16px}
.detail ul li.ingredient-heading{display:block;column-span:all;break-inside:avoid;background:#eef0e8;border-radius:8px;padding:10px 13px;margin:16px 0 5px;color:var(--sage-dark);font-family:Georgia,serif;font-size:17px;font-weight:700;border:0;border-bottom:1px solid #d8ddcf}
.detail ol{padding:0;margin:16px 0 0;max-width:1100px;list-style:none;counter-reset:recipe-step}
.detail ol li{list-style:none;counter-increment:recipe-step;position:relative;padding:12px 0 13px 54px;line-height:1.65;min-height:48px;}
.detail ol li::before{content:counter(recipe-step);position:absolute;left:2px;top:12px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--sage);border-radius:50%;background:var(--paper);font:700 14px Georgia,serif;color:var(--sage-dark);box-sizing:border-box}
@media(max-width:560px){.detail ol li{padding-left:44px}.detail ol li::before{width:28px;height:28px}}

/* Дизайнерские разделители для печатной книги */
.sheet.divider-sheet{height:210mm;min-height:210mm;overflow:hidden}
.divider-frame{height:192mm;border:1.5px solid #c9b896;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;background:radial-gradient(ellipse at center,#fdf9f0 0%,#f3efdf 100%);padding:10mm}
.divider-frame::before{content:"";position:absolute;inset:4mm;border:1px solid #ded6bd;pointer-events:none}
.divider-kicker{font:10px Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:#73856e;margin-bottom:14mm}
.divider-ornament{font:26pt Georgia,serif;color:#a3814e;margin:0 0 7mm}
.divider-name{font:700 29pt Georgia,serif;line-height:1.15;color:#4b5f45;overflow-wrap:anywhere;margin:0 0 7mm}
.divider-rule{width:35mm;border-top:1px solid #a3814e;margin:0 auto 7mm}
.divider-sub{font:italic 12pt Georgia,serif;color:#82725d}
.divider-footer{position:absolute;bottom:13mm;font:9px Arial,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:#a3814e}

</style>
</head>
<body>
<header>
  <small>Личная коллекция</small>
  <h1>Моя кулинарная книга</h1>
  <div class="ornament">❦ ❦ ❦</div>
  <p>Любимые блюда, проверенные рецепты и немного вдохновения.</p>
</header>
<main>
  <div class="tools">
    <input id="search" type="search" placeholder="🔍 Найти рецепт или ингредиент…" aria-label="Поиск рецептов">
    <button class="btn-print" onclick="printBook()">🖨 Распечатать книгу с разделителями</button>
  </div>
  <nav class="filters" id="filters" aria-label="Категории"></nav>
  <div class="count"><span id="countText"></span></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dialog"><div class="detail" id="detail"></div></dialog>

<div id="printView">
  <div class="printbar">
    <button onclick="printRecipe()">🖨 Распечатать рецепт</button>
    <button class="ghost" onclick="backToBook()">← Назад к книге</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
const recipes = [
{id:1,title:'Блинчики',time:'~1 час',short:'Тонкие, нежные, глянцевые — мои любимые.',
ingredients:['Яйца — 2 шт.','Соль — ½ ч. ложки','Сахар — 3 ст. ложки','Молоко — 700 мл (добавить в два приёма по 350 мл)','Мука — 360 г','Кипяток — 300 мл','Сода — 1 ч. ложка','Подсолнечное масло — пока консистенция не станет глянцевой и жидкой'],
steps:['Смешать яйца, соль, сахар и первые 350 мл молока до однородности.','Постепенно всыпать муку, перемешивая до гладкости.','Добавить вторые 350 мл молока, снова перемешать.','Вскипятить 300 мл воды, растворить в ней соду и сразу влить в тесто, быстро перемешать.','Влить подсолнечное масло и мешать, пока тесто не станет глянцевым и нужной текучести.','Разогреть сковороду, слегка смазать маслом, выпекать тонкие блины с двух сторон.']},
{id:2,title:'Имбирное печенье с глазурью',time:'~3 часа',short:'Пряное, ароматное печенье: учитываем охлаждение теста и высыхание глазури.',
ingredients:['Мука — 230–250 г','Яйцо — 1 шт.','Сливочное масло — 100 г','Сахарная пудра — 100 г','Имбирь молотый — 2 ч. ложки','Корица молотая — 1 ч. ложка','Кардамон молотый — 1/2 ч. ложки','Гвоздика молотая — 1/2 ч. ложки','Перец душистый молотый — 1/2 ч. ложки','Какао-порошок — 1 ч. ложка','Мёд — 1 ст. ложка (25 г)','Сода — 1/2 ч. ложки','Соль — 1 щепотка','Глазурь','Яичный белок — 1 шт.','Сахарная пудра — 200 г','Лимонный сок — 1/2 ч. ложки'],
steps:['Достать сливочное масло и яйцо из холодильника, чтобы они стали комнатной температуры.','Смешать все сухие ингредиенты: муку, молотые имбирь, корицу, кардамон, гвоздику, перец, какао, соду, соль и сахарную пудру.','Взбить мягкое сливочное масло, добавить к нему мёд и яйцо, перемешать до однородности.','Соединить жидкую массу с сухими ингредиентами, быстро замесить тесто.','Завернуть тесто в плёнку и убрать в холодильник минимум на 1 час.','Разогреть духовку до 180°C. Раскатать тесто толщиной 1–2 мм для печенья или 5 мм для пряников.','Вырезать фигурки, выложить на противень и выпекать 5–6 минут (для тонкого печенья) или 7–8 минут (для пряников).','Для глазури: взбить яичный белок с просеянной сахарной пудрой до однородности, добавить лимонный сок и продолжать взбивать до плотной, глянцевой массы.','Остудить печенье, нанести глазурь и дать ей полностью высохнуть — на это уходит ещё около часа.']},
{id:3,notes:'Охлаждать минимум 4 часа, а лучше оставить на ночь: за это время крем стабилизируется, а савоярди пропитаются.',title:'Тирамису',time:'~1 час + охлаждение минимум 4 часа',short:'Классический итальянский десерт: час на сборку и минимум час на пропитку в холоде.',
ingredients:['Яйца — 5 шт.','Сахар — 125 г','Маскарпоне — 250 г','Сливки 33% — 325 г','Кофе эспрессо с коньяком — 300 мл','Какао-порошок — для посыпки','Печенье савоярди — по количеству для 2 слоёв'],
steps:['Взбить яйца с сахаром до пышной пены (можно отдельно белки и желтки, а потом соединить).','Соединить холодные сливки и холодный маскарпоне, взбить миксером на медленной скорости.','Аккуратно соединить белковую и желтковую массы с сырно-сливочной смесью лопаткой.','Печенье савоярди быстро пропитать в кофе с коньяком.','Выложить в форму первый слой пропитанного печенья, покрыть половиной крема.','Выложить второй слой печенья, залить оставшимся кремом.','Посыпать какао-порошок через сито.','Убрать в холодильник минимум на 4 часа, а лучше на ночь, чтобы десерт пропитался и стабилизировался.']},
{id:4,notes:'После охлаждения чизкейк должен держать форму по краям, а центр может слегка подрагивать при покачивании формы. Не ориентируйся только на время: духовки отличаются.',title:'Чизкейк с ореховой основой и лимонной глазурью',time:'~3 часа + охлаждение',short:'Нежный чизкейк с ореховой основой и цитрусовой глазурью.',
ingredients:['Для основы: сливочное масло — 50 г','Для основы: яйцо — 1 шт.','Для основы: сахар — 50 г','Для основы: орехи пекан (или кешью) — 200 г','Для начинки: сыр Филадельфия — 600 г','Для начинки: сметана — 200 г','Для начинки: яйца — 3 шт.','Для начинки: сахар — 250 г','Для начинки: сок половины лимона','Для начинки: ванилин — 1/2 ч. ложки','Для глазури: сливочное масло — 50 г','Для глазури: сливки — 100 мл','Для глазури: сахар — 40 г','Для глазури: щепотка соли','Для глазури: лимонный сок — по вкусу'],
steps:['Измельчить орехи и обжарить их до золотистого цвета.','Смешать измельчённые орехи с сахаром, яйцом и растопленным сливочным маслом.','Выложить ореховую смесь в форму, равномерно распределить и выпекать 10 минут при 150°C.','Для начинки: смешать сыр Филадельфия со сметаной и яйцами (не использовать миксер, только лопаткой).','Добавить в начинку сахар, ванилин и сок половины лимона, аккуратно перемешать.','Вылить начинку на остывшую ореховую основу.','Выпекать чизкейк 10 минут при 200°C, затем 25 минут при 100°C.','Выключить духовку, оставить чизкейк внутри с открытой дверцей на 2 часа.','Полностью остудить и убрать в холодильник.','Для глазури: нагреть масло с сахаром до состояния желе, постоянно помешивая.','Постепенно добавить сливки, нагревать до загустения.','Добавить лимонный сок, перемешать.','Полить остывший чизкейк глазурью и снова убрать в холодильник до подачи.']},
{id:5,notes:'Конфи важно уварить до густоты: если масса останется жидкой, она будет вытекать из рулета. Мандарины можно заменить любыми ягодами; при использовании ягод также уваривай смесь до густой консистенции.',title:'Меренговый рулет с мандариновым конфи',time:'~1 час + охлаждение',short:'Воздушный рулет с цитрусовым конфи и нежным кремом.',
ingredients:['Для меренги: холодные белки — 5 шт.','Для меренги: сахарная пудра — 250 г','Для меренги: кукурузный крахмал — 2 ст. л.','Для меренги: лимонная кислота — 1/3 ч. л.','Для меренги: ванильный экстракт — 10–15 капель','Для меренги: миндальные лепестки — для посыпки','Для конфи: крупные мандарины — 4 шт.','Для конфи: желтки — 2 шт.','Для конфи: сахар — 30 г','Для конфи: кукурузный крахмал — 20 г','Для крема: сливки 33% — 170 мл','Для крема: творожный сыр — 270 г','Для крема: сахарная пудра — 50 г'],
steps:['Проблендерить мандарины, процедить сок в сотейник.','Поставить на средний огонь, добавить сахар и крахмал, постоянно мешать и варить до заметного загустения: масса должна стать густой, иначе конфи получится слишком жидким.','Ввести желтки и проварить ещё 2 минуты, постоянно помешивая.','Переложить конфи в ёмкость, накрыть плёнкой в контакт и полностью остудить в холодильнике.','Аккуратно отделить белки (без единой капли желтка).','Взбить белки на малых оборотах до лёгкой пены, порционно всыпать сахарную пудру.','Перейти на высокую скорость и взбивать 10–12 минут, пока масса не станет густой и глянцевой.','Добавить крахмал и лимонную кислоту, взбить ещё 1 минуту на маленькой скорости.','Добавить ванильный экстракт, перемешать.','Пергамент смять и развернуть, выложить меренгу прямоугольным слоем, посыпать миндальными лепестками.','Выпекать в разогретой до 150°C духовке 25 минут (или 30 минут для более плотной корочки).','Взбить сливки до плотных пиков.','Добавить творожный сыр и сахарную пудру, взбить ещё 1 минуту.','Готовую меренгу аккуратно перевернуть, снять пергамент и дать слегка остыть.','Нанести крем, сверху выложить слой мандаринового конфи, свернуть рулет.','Завернуть рулет в плёнку и убрать в холодильник минимум на 1 час перед нарезкой.']},
{id:6,title:'Баноффи',time:'~30 минут + 2 часа',short:'Хрустящая основа, бананы, карамель и нежный крем.',
ingredients:['Для основы: песочное печенье — 120 г','Для основы: солёная соломка — 50 г','Для основы: сливочное масло — 100 г','Для карамели: сливки 33% — 200 г','Для карамели: сахар — 200 г','Для карамели: соль — 3 г','Для карамели: желатиновая масса — 25 г (желатин замочить 1:5)','Для карамели: сливочное масло — 140 г','Для слоя: бананы — 2 шт.','Для крема: сливки 33% — 100 г','Для крема: творожный сыр — 100 г'],
steps:['Измельчить печенье и соломку, смешать с растопленным маслом.','Утрамбовать в форме диаметром 16–18 см, сформировав дно и бортики. Убрать в холодильник.','Сливки с солью довести до кипения и отставить.','Сахар растапливать на медленном огне в три приёма, не перемешивая ложкой.','В готовую карамель осторожно влить горячие сливки, постоянно помешивая.','Добавить желатиновую массу, перемешать до однородности, остудить.','Добавить 140 г мягкого сливочного масла, пробить блендером до гладкости.','Выложить карамель на основу, сверху распределить нарезанные бананы.','Для крема взбить холодные сливки до плотных пиков, добавить творожный сыр, взбить до однородности.','Распределить крем по десерту, убрать в холодильник минимум на 2 часа.']},
{id:7,title:'Морковный кекс',time:'~50 минут + охлаждение',short:'Влажный кекс с морковью, орехами и творожной начинкой.',
ingredients:['Для теста: яйца — 2 шт.','Для теста: сахар белый — 75 г','Для теста: сахар коричневый — 75 г','Для теста: растительное масло — 50 мл','Для теста: цедра апельсина — 1 шт.','Для теста: корица — 1 ч. л.','Для теста: мука — 180 г','Для теста: разрыхлитель — 10 г','Для теста: морковь — примерно 60 г (1 средняя, очищенная)','Для теста: грецкие орехи — 50 г','Для начинки: творог — 180 г','Для начинки: яйцо — 1 шт.','Для начинки: сахарная пудра — 30 г','Для начинки: крахмал — 1 ст. л.','Для крема: творожный сыр — 120 г','Для крема: варёная сгущёнка — 80 г'],
steps:['Для теста смешать яйца с сахаром, влить масло.','Добавить цедру апельсина, корицу, просеянную муку с разрыхлителем.','Натереть морковь на мелкой тёрке, добавить в тесто вместе с измельчёнными орехами.','Для начинки смешать творог, яйцо, сахарную пудру и крахмал до однородности.','В форму выложить половину теста, затем творожную начинку, сверху оставшуюся половину теста.','Выпекать при 165°C примерно 50 минут.','Для крема смешать варёную сгущёнку и творожный сыр до однородности.','Нанести крем на полностью остывший кекс.']},
{id:8,notes:'Для желейного слоя взято около 270 г смеси: 150 г ягод и примерно 120 мл воды. 6 г желатина — ориентир для мягкого, но нарезаемого слоя; фактическая сила желирования зависит от желатина и количества жидкости.',title:'Паштет с ягодным желе',time:'~40 минут + охлаждение',short:'Нежный куриный паштет и яркое ягодное желе сверху.',
ingredients:['Для паштета: печень куриная — 500 г','Для паштета: лук — 1 шт.','Для паштета: морковь — 1 шт.','Для паштета: яблоко — 1 шт.','Для паштета: чеснок — 3 зубчика','Для паштета: соль, перец, специи — по вкусу','Для паштета: сливки — по вкусу','Для желе: вишня — 100 г','Для желе: брусника — 50 г','Для желе: подсластитель — по вкусу','Для желе: вода — 1/2 стакана (около 120 мл)','Для желе: желатин — 6 г'],
steps:['Форму смазать маслом, выложить печень и сверху все овощи и яблоко.','Посолить, поперчить, отправить в духовку на 40 минут при 180°C.','К ягодам добавить подсластитель и воду, потушить на маленьком огне.','По готовности пробить печень со всеми овощами и сливками блендером до однородной массы.','Ягоды тоже пробить блендером, добавить желатин согласно инструкции.','Выложить паштет в форму, сверху залить желе.','Отправить в холодильник для стабилизации.']},
{id:9,title:'Хлеб',time:'~1 час расстойки + 40 минут выпечки',short:'Простой домашний хлеб с семечками и румяной корочкой.',
ingredients:['Мука — 500 г','Сухие дрожжи — 7 г (или живые — 25 г)','Сахар — 1 ст. л.','Соль — 0,5 ст. л.','Семечки — по вкусу','Тёплая вода (30–40°C) — 350 мл'],
steps:['Все сухие ингредиенты перемешать.','Влить тёплую воду, перемешать. Тесто будет липким.','Накрыть пакетом или полотенцем и поставить в тёплое место на 1 час.','Тесто растянуть руками, сложить пополам, снова растянуть — и так несколько раз.','Сформовать хлеб, убрать в пакет для запекания, сделать надрезы и плотно завязать пакет.','Выпекать при 190–200°C около 40 минут — до крепкой коричневой корочки.']},
{id:10,title:'Лимонные полоски',time:'~25 минут + глазурь',short:'Нежные полоски с насыщенным цитрусовым вкусом и сладкой глазурью.',
ingredients:['Для теста: сахар — 180 г','Для теста: цедра 1 лимона','Для теста: яйца — 2 шт.','Для теста: сливочное масло — 170 г','Для теста: лимонный сок — 40 мл','Для теста: мука — 150 г','Для теста: кукурузный крахмал — 15 г','Для теста: растительное масло — 15 г','Для теста: ванильный сахар — 1 ч. л.','Для глазури: сгущёнка — 100 г','Для глазури: лимонный сок — ~30 г'],
steps:['Сахар смешать с цедрой лимона.','Добавить яйца и хорошо перемешать венчиком.','Влить растопленное сливочное масло и лимонный сок, затем растительное масло. Перемешать до однородности.','Всыпать муку, кукурузный крахмал и ванильный сахар. Долго вымешивать тесто не нужно.','Перелить тесто в форму, застеленную пергаментом.','Выпекать в заранее разогретой до 180°C духовке 20–25 минут.','Пока полоски остывают, приготовить глазурь: смешать сгущёнку и лимонный сок.','Полить остывшие полоски глазурью.']},
{id:11,title:'Сырники',time:'~20 минут',short:'Нежные, с румяной корочкой и мягкой серединкой.',
ingredients:['Творог — 180 г','Сахар — 30–50 г (по вкусу)','Желток — 1 шт.','Мука — 30 г','Мука для обваливания'],
steps:['Творог лучше протереть через сито, но можно и размять вилкой.','Добавить желток, сахар и муку, тщательно перемешать до однородности.','Скатать шарики, слегка обваляв их в муке.','Сформировать шайбочки.','Обжарить на разогретой сковороде с небольшим количеством масла до золотистой корочки с двух сторон.']},
{id:12,title:'Крем-чиз',time:'~15 минут',short:'Бархатный сливочно-творожный крем — база для тортов и капкейков.',
ingredients:['Сливочно-творожный сыр — 500 г','Сливки 33–35% — 100 г','Сахарная пудра — 40 г'],
steps:['Сыр и сливки заранее хорошо охладить — холодные ингредиенты взбиваются стабильно.','Слегка взбить сыр на низких оборотах, чтобы он стал пластичным.','Добавить сахарную пудру и перемешать.','Влить холодные сливки и взбивать до плотных, устойчивых пиков.','Важно не перевзбить: как только крем держит форму — остановиться.']},
{id:13,notes:'Если добавить коньяк после загущения, его аромат и вкус будут заметнее. Если хочется более мягкого вкуса, коньяк можно добавить раньше и немного прогреть вместе с начинкой.',title:'Вишнёвая начинка для торта',time:'~20 минут + остывание',short:'Сочно-ягодная начинка с лёгкой коньячной ноткой.',
ingredients:['Вишня — 300 г','Сахар — 80 г','Кукурузный крахмал — 10 г','Вода — для разведения крахмала','Коньяк — по вкусу'],
steps:['Соединить вишню с сахаром.','Варить до полного растворения сахара.','Кипятить несколько минут, чтобы ягода дала сок.','Развести крахмал в небольшом количестве воды и влить в начинку, помешивая.','Добавить коньяк по вкусу.','Полностью остудить перед использованием в торте.']},
{id:14,notes:'Готовый бисквит слегка пружинит при лёгком нажатии, а деревянная шпажка из центра выходит сухой, без сырого теста.',title:'Классический бисквит',time:'~40–50 минут',short:'Пышный, воздушный — идеальная основа для праздничных тортов.',
ingredients:['Яйца — 4 шт.','Сахар — 200 г','Мука — 150 г','Кукурузный крахмал — 50 г','Ванильный экстракт — по вкусу'],
steps:['Яйца взбить на средней скорости до лёгкой пены.','Постепенно всыпать сахар, продолжая взбивать, пока масса не станет светлой, пышной и устойчивой.','Вмешать лопаткой просеянные муку с крахмалом — аккуратно, чтобы сохранить воздух.','Вылить тесто в форму.','Выпекать при 185°C 30–40 минут без конвекции.','Готовность проверить деревянной шпажкой: она должна выходить сухой.']},
{id:15,title:'Вишнёвая пропитка',time:'~15 минут',short:'Ароматный сироп, который оживит суховатый бисквит.',
ingredients:['Вишня — 75 г','Вода — 75 г','Сахар — 150 г'],
steps:['Соединить вишню, воду и сахар в сотейнике.','Довести до кипения, помешивая, до полного растворения сахара.','Проварить пару минут на слабом огне.','Процедить (по желанию) и полностью остудить.','Пропитать бисквит остывшим сиропом.']},
{id:16,title:'Крем для росписи',time:'~10 минут',short:'Плотный крем, который держит форму — идеален для декора.',
ingredients:['Творожный сыр — 150 г (тёплый)','Сахар — 45 г','Сливки 33% — 60 г (холодные)'],
steps:['Творожный сыр достать заранее, чтобы он стал тёплым.','Смешать тёплый сыр с сахаром до растворения крупинок.','Влить холодные сливки.','Взбить до устойчивой, плотной консистенции.','Крем готов к росписи — держит форму и не течёт.']}
,{id:17,title:'Ньокки с грибным соусом',time:'~1 час 10 минут',short:'Картофельные ньокки с грибным сливочным соусом, трюфельным маслом и хрустящим луком.',ingredients:['Ньокки: картофель — 4 шт.','Ньокки: мука — 100 г','Ньокки: пармезан — 60 г','Ньокки: соль, перец — по вкусу','Соус: масло растительное — 100 мл','Соус: лук репчатый — 1 шт.','Соус: грибы — 200 г','Соус: сливки 33% — 200 мл','Соус: петрушка — 5 г','Соус: масло белого трюфеля — 5 г','Соус: хрустящий лук — 5 г'],steps:['Картофель очистить, отварить и полностью остудить.','Размять картофель, вмешать муку и половину пармезана, скатать колбаски толщиной около 2 см и нарезать подушечки.','Отварить ньокки в кипящей воде 1–2 минуты после всплытия, затем обжарить до румяной корочки.','Для соуса обжарить лук, добавить грибы и готовить, пока не выпарится жидкость.','Влить сливки и прогреть соус.','Снять соус с огня и добавить трюфельное масло.','Подавать ньокки с соусом, оставшимся пармезаном, петрушкой и хрустящим луком.']},
{id:18,title:'Тарталетки для закусок',time:'~40 минут',short:'Один рецепт — девять вариантов начинки для праздничных тарталеток.',ingredients:['Основа','Тарталетки','Зелень для украшения','Начинка 1. Курица + ананас + сыр','куриное филе','ананас','сыр','майонез','Начинка 2. Крабовые палочки + кукуруза + яйцо','крабовые палочки','кукуруза','яйцо','майонез','Начинка 3. Сёмга + сливочный сыр + огурец','сёмга','сливочный сыр','огурец','Начинка 4. Грибы + лук + сливочный сыр','грибы','лук','сливочный сыр','Начинка 5. Креветки + авокадо + лайм','креветки','авокадо','сок лайма','Начинка 6. Тунец + яйцо + зелёный лук','тунец','яйцо','зелёный лук','йогурт','Начинка 7. Свёкла + фета + грецкий орех','свёкла','фета','грецкий орех','Начинка 8. Ветчина + сыр + сладкий перец','ветчина','сыр','сладкий перец','майонез','Начинка 9. Печёночный паштет + маринованный огурец','печёночный паштет','маринованный огурец'],steps:['Тарталетки при желании подрумянить 5 минут при 160°C и полностью остудить.','Для смешанных начинок ингредиенты нарезать мелким кубиком и заправить майонезом или йогуртом.','Для кремовых начинок (сёмга, креветки) сыр или пюре отсадить мешком, сверху выложить рыбу, креветки и овощи.','Грибную начинку полностью остудить перед наполнением.','Наполнять за 30–60 минут до подачи, чтобы стенки не размокли, украсить зеленью.']},

/* Ингредиенты остаются в исходном порядке и с исходными формулировками.
   Префикс части переносится в отдельный заголовок. */
function canonicalPartLabel(raw){
  var label=String(raw).replace(/^Для\s+/i,'').trim().toLocaleLowerCase('ru');
  var labels={
    'основы':'Основа','основа':'Основа',
    'теста':'Тесто','тесто':'Тесто',
    'начинки':'Начинка','начинка':'Начинка',
    'крема':'Крем','крем':'Крем',
    'меренги':'Меренга','меренга':'Меренга',
    'конфи':'Конфи','карамели':'Карамель','карамель':'Карамель',
    'слоя':'Слой','слой':'Слой',
    'глазури':'Глазурь','глазурь':'Глазурь',
    'паштета':'Паштет','паштет':'Паштет',
    'желе':'Желе','ньокки':'Ньокки','соус':'Соус',
    'индейка':'Индейка','сборка':'Сборка'
  };
  return labels[label] || (label.charAt(0).toLocaleUpperCase('ru')+label.slice(1));
}
function isIngredientHeading(s){
  s=String(s).trim();
  return /^(Основа|Тесто|Начинка|Крем|Меренга|Конфи|Карамель|Слой|Глазурь|Паштет|Желе|Ньокки|Соус|Индейка|Сборка)$/i.test(s) || /^Начинка [1-9]\./i.test(s);
}
function normalizeIngredientParts(){
  recipes.forEach(function(r){
    var out=[], lastPart=null;
    r.ingredients.forEach(function(raw){
      var s=String(raw).trim();
      var m=s.match(/^([^:]{2,35}):\s*(.+)$/);
      if(m){
        var part=canonicalPartLabel(m[1]);
        if(part!==lastPart){out.push(part);lastPart=part;}
        out.push(m[2].trim());
      } else if(/^Начинка [1-9]\./i.test(s) || /^(Основа|Тесто|Сборка)$/i.test(s)){
        out.push(s);
        lastPart=s;
      } else {
        out.push(s);
      }
    });
    r.ingredients=out;
  });
}
normalizeIngredientParts();

/* ---------- пересчёт ингредиентов ---------- */
function roundNice(v){
  if(Math.abs(v-Math.round(v))<0.011) return Math.round(v);
  if(v<1) return Math.round(v*4)/4;
  if(v<10) return Math.round(v*2)/2;
  if(v<100) return Math.round(v);
  return Math.round(v/5)*5;
}
function fmt(v){
  v=roundNice(v);
  var s=(Math.round(v*100)/100).toString();
  return s.replace('.',',');
}
function num(s){return parseFloat(String(s).replace(',','.'))}
function scaleIngredient(t,k){
  if(isIngredientHeading(t)||k===1) return t;
  var saved=[];
  function hold(v){saved.push(v);return '\uE000'+String.fromCharCode(65+saved.length-1)+'\uE001';}
  t=String(t);
  t=t.replace(/\d+(?:[.,]\d+)?\s*[–—-]\s*\d+(?:[.,]\d+)?\s*%/g,function(m){return hold(m)});
  t=t.replace(/\d+(?:[.,]\d+)?\s*%/g,function(m){return hold(m)});
  t=t.replace(/\d+(?:[.,]\d+)?\s*:\s*\d+(?:[.,]\d+)?/g,function(m){return hold(m)});
  t=t.replace(/\d+(?:[.,]\d+)?\s*°\s*C?/gi,function(m){return hold(m)});
  t=t.replace(/(\d+(?:[.,]\d+)?)\s*[–—-]\s*(\d+(?:[.,]\d+)?)/g,function(m,a,b){return hold(fmt(num(a)*k)+'–'+fmt(num(b)*k))});
  t=t.replace(/(\d+)\s*\/\s*(\d+)/g,function(m,a,b){return hold(fmt(num(a)*k/num(b)))});
  t=t.replace(/[Пп]оловин[аыи]?\s*/g,function(){return hold(fmt(0.5*k)+' ')});
  t=t.replace(/^[Пп]ол\s+/g,function(){return hold(fmt(0.5*k)+' ')});
  t=t.replace(/\d+(?:[.,]\d+)?/g,function(m){return fmt(num(m)*k)});
  t=t.replace(/\uE000([A-Z])\uE001/g,function(m,i){return saved[i.charCodeAt(0)-65]});
  return t;
}
function portionLabel(k){
  if(k===0.5) return '½ порции';
  if(k===1) return '1 порция';
  return k+' порции';
}

'ol.steps li::before{content:counter(s);position:absolute;left:.6mm;top:1mm;width:6mm;height:6mm;box-sizing:border-box;',
'border:1.1px solid #7a6b52;border-radius:50%;display:flex;align-items:center;justify-content:center;',
'font-size:7.5pt;color:#4d4030;font-weight:bold;background:#faf6ec}',

'.notes .note-text{font:7.2pt/1.3 Arial,sans-serif;color:#766b59;margin:0 0 2mm}',
'.notes .write-area{height:19mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5.5mm,#e5dcc9 5.5mm,#e5dcc9 5.7mm)}',
'.sheet.divider-sheet{height:210mm;min-height:210mm;overflow:hidden}',

'.divider-frame::before{content:"";position:absolute;inset:4mm;border:1px solid #ded6bd}',

var MM=96/25.4;
var PAGE_INNER=Math.floor(179*MM)-6;

function buildPrintPage(doc,r,steps,ings,k,isCont,startIdx,withNotes){
  var el=doc.createElement('div'); el.className='sheet';
  el.innerHTML=holesHTML()+'<div class="frame">'+pageInner(r,steps,ings,k,isCont,startIdx,withNotes)+'</div>';
  return el;
}

function paginateRecipe(doc,r,k){
  var pages=[];
  var steps=r.steps.slice();
  var ings=r.ingredients.slice();
  var cont=false;
  for(var guard=0;guard<40;guard++){
    var startIdx=r.steps.length-steps.length;
    var el=buildPrintPage(doc,r,steps,ings,k,cont,startIdx,false);
    doc.body.appendChild(el);
    var frame=el.querySelector('.frame');
    var nextSteps=[],nextIngs=[];
    var g=0;
    while(frame.getBoundingClientRect().height>PAGE_INNER && g++<800){
      var lis=el.querySelectorAll('ol.steps li');
      if(lis.length>0){
        nextSteps.unshift(steps.pop());
        lis[lis.length-1].parentNode.removeChild(lis[lis.length-1]);
      } else {
        var ilis=el.querySelectorAll('ul.ing li');
        if(ilis.length>1){
          nextIngs.unshift(ings.pop());
          ilis[ilis.length-1].parentNode.removeChild(ilis[ilis.length-1]);
        } else break;
      }
    }
    if(nextSteps.length===0 && nextIngs.length===0){
      var notesEl=doc.createElement('div');notesEl.className='notes';notesEl.innerHTML='<b>Заметки</b>'+(r.notes?'<p class="note-text">'+esc(r.notes)+'</p>':'')+'<div class="write-area"></div>';
      frame.appendChild(notesEl);
      pages.push(el);
      if(frame.getBoundingClientRect().height>PAGE_INNER){
        frame.removeChild(notesEl);
        var np=buildPrintPage(doc,r,[],[],k,true,0,true);
        doc.body.appendChild(np);
        pages.push(np);
      }
      break;
    }
    pages.push(el);
    steps=nextSteps;ings=nextIngs;cont=true;
  }
  return pages;
}

/* Разделители размещаются в начале всей книги, а затем идут рецепты по категориям. */
function categoryOrder(){return cats.filter(function(c){return c!=='Все рецепты';});}
function dividerHTML(cat){
  return holesHTML()+'<div class="divider-frame">'+
    '<div class="divider-kicker">Моя кулинарная книга</div>'+
    '<div class="divider-ornament">❦</div>'+
    '<div class="divider-name">'+esc(cat)+'</div>'+
    '<div class="divider-rule"></div>'+
    '<div class="divider-sub">Семейный архив рецептов</div>'+
    '<div class="divider-footer">С любовью к домашней кухне</div>'+
  '</div>';
}
function addDividerPage(doc,cat){
  var el=doc.createElement('div');el.className='sheet divider-sheet';
  el.innerHTML=dividerHTML(cat);doc.body.appendChild(el);return el;
}

function printList(list,portion,withDividers){
  var old=document.getElementById('printFrame');
  if(old) old.remove();
  var f=document.createElement('iframe');
  f.id='printFrame';
  f.style.cssText='position:fixed;left:-10000px;top:0;width:148mm;height:210mm;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(f);
  var d=f.contentDocument||f.contentWindow.document;
  d.open();
  d.write('<!doctype html><html lang="ru"><head><meta charset="UTF-8">'+
    '<title>Моя кулинарная книга — печать</title>'+
    '<style>'+PRINT_CSS+'</style></head><body></body>');
  d.close();
  var hasPhoto=list.some(function(r){return !!r.photo});
  var doPrint=function(){
    try{
      if(withDividers){categoryOrder().forEach(function(c){addDividerPage(d,c);});}
      var ordered=withDividers?list.slice().sort(function(a,b){
        return categoryOrder().indexOf(assignments[a.id])-categoryOrder().indexOf(assignments[b.id]) || a.id-b.id;
      }):list;
      ordered.forEach(function(r){
        var pages=paginateRecipe(d,r,portion);
        if(pages.length%2===1 && list.length>1){
          var b=d.createElement('div');b.className='sheet blank';
          d.body.appendChild(b);
        }
      });
    }catch(e){
      alert('Не удалось подготовить страницы для печати: '+e.message);
      return;
    }
    setTimeout(function(){
      try { f.contentWindow.focus(); f.contentWindow.print(); }
      catch(e){ alert('Печать не открылась: '+e.message); }
    },450);
  };
  if(hasPhoto){setTimeout(doPrint,600);}else{doPrint();}
}
function printRecipe(){
  var r=recipes.find(function(x){return x.id===currentId});
  if(!r) return;
  printList([r],currentPortion);
}
function printBook(){printList(recipes,1,true)}

renderFilters(); renderGrid();
filters.addEventListener('click',function(e){

  activeCat=b.dataset.cat; renderFilters(); renderGrid();
});
grid.addEventListener('click',function(e){
  var h=e.target.closest('.heart');
  if(h){
    var id=+h.dataset.heart;
    liked.has(id)?liked.delete(id):liked.add(id);
    renderGrid(); return;
  }
  var c=e.target.closest('.recipe');
  if(c) openDetail(+c.dataset.id);
});
dialog.addEventListener('click',function(e){
  var p=e.target.closest('.pbtn');
  if(p) setPortion(+p.dataset.k);
});
search.addEventListener('input',renderGrid);
