<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кулинарная книга</title>
<style>
:root{--acc:#b3562e;--bg:#faf6f1;--ink:#3d3428;--green:#3e7d4e}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:30px;letter-spacing:1px}
header p{margin:6px 0 0;opacity:.85;font-size:14px}
#cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px}
#cats button{background:#fff;border:1px solid #d8c9b8;border-radius:20px;padding:7px 16px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
#cats button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:1100px;margin:0 auto 40px;padding:0 16px}
.card{background:#fff;border:1px solid #e4d8c8;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card .ph{height:130px;background:#f0e7db;display:flex;align-items:center;justify-content:center;font-size:40px}
.card img{width:100%;height:130px;object-fit:cover}
.card .cb{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:17px;color:var(--acc)}
.card .meta{font-size:12px;color:#8a7d6b}
.card .nut{font-size:12px;color:var(--green)}
#ov{display:none;position:fixed;inset:0;background:rgba(30,20,10,.55);z-index:50;overflow:auto}
#ov.open{display:block}
#modal{background:#fff;max-width:1080px;margin:30px auto;border-radius:14px;padding:26px 34px;min-height:60vh}
.mphoto{width:100%;max-height:280px;object-fit:cover;border-radius:10px}
.mph{width:100%;height:200px;background:#f0e7db;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:50px}
#modal h2{color:var(--acc);margin:14px 0 4px}
.pmeta{color:#8a7d6b;font-size:13px;margin-bottom:10px}
.nutbox{background:#eef6ef;border:1px solid #cfe3d3;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.nutbox table{border-collapse:collapse;font-size:13.5px}
.nutbox td,.nutbox th{padding:2px 10px;text-align:left}
.nutbox th{border-bottom:1px solid #cfe3d3;font-weight:600;color:var(--green)}
.nutnote{font-size:11.5px;color:#5f7a66;margin-top:6px}
.pctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#f6efe6;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.pctl button{border:1px solid #c9b8a2;background:#fff;border-radius:8px;padding:5px 12px;font-family:inherit;cursor:pointer;font-size:14px}
.pctl button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pctl input{width:70px;padding:5px 8px;border:1px solid #c9b8a2;border-radius:8px;font-family:inherit;font-size:14px}
.pctl .lbl{color:#8a7d6b;font-size:13px}
.ph{color:var(--acc);font-size:15px;margin:14px 0 4px;font-variant:small-caps;letter-spacing:.5px}
.pi{padding:2px 0 2px 10px;border-left:2px solid #e8dcc9}
.steps{counter-reset:st}
.steps li{margin:7px 0;padding-left:4px}
.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-family:inherit;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
#prev{display:none;position:fixed;inset:0;background:rgba(30,20,10,.7);z-index:60;overflow:auto;padding:20px}
#prev.open{display:block}
#prevInner{max-width:900px;margin:0 auto}
#prev .btnrow{margin-bottom:12px}
.sheetwrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.sheet{width:148mm;min-height:210mm;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;padding:10mm 10mm 10mm 24mm;font-size:12.5px;line-height:1.45;overflow:hidden}
.sheet.small{transform:scale(.92);transform-origin:top center;margin-bottom:-14mm}
.hole{position:absolute;width:6mm;height:6mm;border-radius:50%;background:var(--bg);border:1px solid #d8c9b8;left:9mm}
.sh h3{color:var(--acc);margin:0 0 4px;font-size:17px}
.sh .sm{font-size:11px;color:#8a7d6b;margin-bottom:4px}
.sh .phh{font-variant:small-caps;color:var(--acc);font-size:13px;margin:7px 0 1px}
.sh .itm{padding-left:8px;border-left:2px solid #e8dcc9}
.sh table.n{border-collapse:collapse;font-size:11px;margin:4px 0}
.sh table.n td,.sh table.n th{padding:1px 8px;text-align:left;border-bottom:1px solid #eee}
.sh .nn{font-size:9.5px;color:#777;margin-top:4px}
.sh .cont{position:absolute;bottom:6mm;left:0;right:0;text-align:center;color:#a99;font-style:italic;font-size:11px}
footer{text-align:center;padding:18px;color:#a89a86;font-size:13px}
@media print{
 body>*{display:none!important}
 #printArea{display:block!important}
 @page{size:148mm 210mm;margin:0}
 .sheet{box-shadow:none;width:148mm;height:210mm;min-height:210mm;page-break-after:always}
}
</style>
</head>
<body>
<header><h1>Кулинарная книга</h1><p>с калькулятором порций и примерным КБЖУ</p></header>
<div id="cats"></div>
<div id="grid"></div>
<footer>Домашняя кулинарная книга · печать А5, отверстия под кольца 4×⌀6 мм</footer>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="modal"></div></div>
<div id="prev" onclick="if(event.target===this)closeP()"><div id="prevInner"></div></div>
<div id="printArea"></div>
<script>
const R=[
{id:1,t:'Блинчики',cat:'Завтраки',time:'40 мин',serv:8,yield:650,photo:'img/1.jpg',
 parts:[{n:'Тесто',it:[['Молоко','300','мл'],['Яйцо','2','шт.'],['Мука','180','г'],['Сахар','30','г'],['Масло растительное','30','мл'],['Соль','½','ч. л.']]}],
 steps:['Взбить яйца с сахаром и солью, влить половину молока.','Просеять муку, размешать до гладкости, добавить остальное молоко и растительное масло.','Дать тесту отдохнуть 15 минут.','Выпекать на разогретой сковороде по 1–2 минуты с каждой стороны.','Складывать стопкой, смазывая сливочным маслом.']},
{id:2,t:'Имбирное печенье',cat:'Выпечка',time:'1,5 часа + охлаждение',serv:20,yield:480,photo:'img/2.jpg',
 parts:[{n:'Тесто',it:[['Мука','230–250','г'],['Сливочное масло','100','г'],['Сахар','100','г'],['Мёд','100','г'],['Яйцо','1','шт.'],['Сода','1','ч. л.'],['Корица','2','ч. л.'],['Имбирь молотый','2','ч. л.'],['Кардамон','½','ч. л.'],['Соль','½','ч. л.']]},
 {n:'Глазурь',it:[['Сахарная пудра','100','г'],['Сливки 33%','2–3','ст. л.']]}],
 steps:['Растереть мягкое масло с сахаром, добавить мёд, яйцо и все специи.','Всыпать муку с содой, замесить гладкое тесто.','Убрать в холодильник минимум на 1 час.','Раскатать пласт 5–6 мм, вырезать фигурки.','Выпекать при 180°C 10–12 минут.','Остудить и расписать глазурью из пудры, разведённой сливками.']},
{id:3,t:'Тирамису',cat:'Десерты',time:'30 мин + 4 часа',serv:8,yield:1100,photo:'img/3.jpg',
 parts:[{n:'Кофе',it:[['Кофе эспрессо','250','мл'],['Сахар','30','г'],['Амаретто','30','мл']]},
 {n:'Крем',it:[['Маскарпоне','500','г'],['Желтки','4','шт.'],['Сахар','100','г'],['Сливки 33%','200','мл']]},
 {n:'Сборка',it:[['Савоярди','200','г'],['Какао-порошок','15','г']]}],
 steps:['Сварить кофе, растворить сахар, остудить и влить амаретто.','Желтки растереть с сахаром до светлой массы, вмешать маскарпоне.','Взбить холодные сливки до мягких пиков, аккуратно соединить с кремом.','Савоярди окунать в кофе буквально на 1–2 секунды и укладывать слоями с кремом.','Убрать в холодильник минимум на 4 часа.','Перед подачей присыпать какао через сито.']},
{id:4,t:'Чизкейк',cat:'Десерты',time:'1,5 часа + 4 часа',serv:10,yield:1300,photo:'img/4.jpg',
 parts:[{n:'Основа',it:[['Печенье песочное','200','г'],['Сливочное масло','100','г']]},
 {n:'Крем',it:[['Сливочный сыр','600','г'],['Сахар','150','г'],['Яйцо','3','шт.'],['Сливки 33%','150','мл'],['Ванильный экстракт','1','ч. л.']]}],
 steps:['Печенье измельчить в крошку, смешать с растопленным маслом, утрамбовать в форму 20 см.','Выпекать основу 10 минут при 180°C.','Сыр комнатной температуры взбить с сахаром на низкой скорости.','По одному ввести яйца, затем влить сливки и ваниль, не перевзбивая.','Вылить крем на основу.','Выпекать на водяной бане при 160°C 60–70 минут: центр должен слегка дрожать.','Остудить в приоткрытой духовке, затем убрать в холодильник минимум на 4 часа.']},
{id:5,t:'Меренговый рулет',cat:'Десерты',time:'1 час + 2 часа',serv:8,yield:700,photo:'img/5.jpg',
 parts:[{n:'Меренга',it:[['Белки','4','шт.'],['Сахарная пудра','200','г'],['Крахмал кукурузный','15','г'],['Лимонный сок','1','ч. л.']]},
 {n:'Крем',it:[['Творожный сыр','300','г'],['Сливки 33%','100','мл'],['Сахарная пудра','50','г']]},
 {n:'Начинка',it:[['Ягоды свежие','250','г']]}],

{id:6,t:'Баноффи',cat:'Десерты',time:'40 мин + 3 часа',serv:8,yield:1200,photo:'img/6.jpg',

 {n:'Начинка',it:[['Банан','3','шт.'],['Сливки 33%','300','мл'],['Шоколад тёмный','30','г']]}],
 steps:['Печенье измельчить, смешать с растопленным маслом, утрамбовать в форму и выпечь 10 минут при 180°C.','Карамель прогреть с маслом до текучести, вмешать сливки, распределить по остывшей основе.','Бананы нарезать кружочками, выложить на карамель.','Взбить холодные сливки и покрыть бананы.','Натереть шоколад сверху и убрать в холодильник минимум на 3 часа.']},
{id:7,t:'Морковный кекс',cat:'Выпечка',time:'1 час 20 мин',serv:10,yield:1200,photo:'img/7.jpg',
 parts:[{n:'Тесто',it:[['Морковь','300','г'],['Яйцо','3','шт.'],['Сахар','180','г'],['Масло растительное','180','мл'],['Мука','200','г'],['Орехи грецкие','80','г'],['Разрыхлитель','1½','ч. л.'],['Корица','2','ч. л.'],['Имбирь молотый','1','ч. л.'],['Соль','½','ч. л.']]},
 {n:'Крем',it:[['Творожный сыр','300','г'],['Сливочное масло','100','г'],['Сахарная пудра','100','г']]}],
 steps:['Морковь натереть на мелкой тёрке.','Взбить яйца с сахаром, влить растительное масло.','Смешать муку с разрыхлителем и специями, соединить с морковью и орехами.','Выпекать при 170°C 60–70 минут — шпажка из центра должна выходить сухой.','Полностью остудить на решётке.','Взбить сыр с мягким маслом и пудрой, покрыть кекс.']},
{id:8,t:'Паштет куриный',cat:'Закуски',time:'1 час',serv:8,yield:700,photo:'img/8.jpg',
 parts:[{n:'Основной',it:[['Печень куриная','500','г'],['Лук репчатый','150','г'],['Морковь','150','г'],['Сливочное масло','100','г'],['Сливки 33%','50','мл'],['Соль','1','ч. л.'],['Перец чёрный',null,'по вкусу'],['Тимьян','1','ч. л.']]}],
 steps:['Обжарить лук и морковь на половине сливочного масла до мягкости.','Добавить печень, обжаривать 7–8 минут, посолить и приправить.','Влить сливки, прогреть 3 минуты, снять с огня и остудить.','Пробить блендером до гладкости, вмешать оставшееся размягчённое масло.','Охладить минимум 2 часа. Подавать с тостами.']},
{id:9,t:'Домашний хлеб',cat:'Выпечка',time:'2 часа',serv:10,yield:900,photo:'img/9.jpg',
 parts:[{n:'Тесто',it:[['Мука','500','г'],['Вода тёплая','300','мл'],['Дрожжи сухие','7','г'],['Сахар','30','г'],['Соль','8','г'],['Масло сливочное','30','г']]}],
 steps:['Растворить дрожжи и сахар в тёплой воде, дать подняться 10 минут.','Соединить с мукой и солью, замешивать 8–10 минут, в конце вмешать мягкое масло.','Накрыть и оставить на 1 час — тесто должно увеличиться вдвое.','Сформовать буханку, дать расстояться ещё 40 минут.','Сделать надрезы лезвием.','Выпекать при 200°C 15 минут, затем при 180°C ещё 25 минут.','Остудить на решётке — резать тёплым можно, но мякиш лучше устоится на следующий день.']},
{id:10,t:'Лимонные полоски',cat:'Десерты',time:'1 час + охлаждение',serv:12,yield:950,photo:'img/10.jpg',

 {n:'Лимонная начинка',it:[['Лимоны','3','шт.'],['Сахар','150','г'],['Яйцо','3','шт.'],['Мука','30','г']]},
 {n:'Глазурь',it:[['Сахарная пудра','80','г'],['Лимонный сок','20','мл']]}],

{id:11,t:'Сырники',cat:'Завтраки',time:'30 мин',serv:4,yield:650,photo:'img/11.jpg',

 steps:['Творог размять вилкой, смешать с яйцом, сахаром и ванилью.','Всыпать муку, замесить мягкое тесто.','Сформовать шайбочки, обвалять в муке.','Обжаривать на среднем огне по 2–3 минуты с каждой стороны.','Довести под крышкой 5 минут. Подавать со сметаной или вареньем.']},
{id:12,t:'Крем-чиз',cat:'Кремы и начинки',time:'15 мин',serv:12,yield:600,photo:'img/12.jpg',
 parts:[{n:'Основной',it:[['Творожный сыр','500','г'],['Сливки 33%','100','мл'],['Сахарная пудра','60','г'],['Ванильный экстракт','1','ч. л.']]}],

{id:13,t:'Вишнёвая начинка',cat:'Кремы и начинки',time:'20 мин',serv:12,yield:550,photo:'img/13.jpg',
 parts:[{n:'Основной',it:[['Вишня замороженная','500','г'],['Сахар','120','г'],['Крахмал кукурузный','20','г'],['Вода','50','мл']]}],

{id:14,t:'Бисквит',cat:'Выпечка',time:'40 мин',serv:8,yield:450,photo:'img/14.jpg',

{id:15,t:'Пропитка',cat:'Кремы и начинки',time:'10 мин',serv:12,yield:300,photo:'img/15.jpg',

{id:16,t:'Крем для росписи (айсинг)',cat:'Кремы и начинки',time:'15 мин',serv:12,yield:280,photo:'img/16.jpg',

{id:17,t:'Ньокки с грибным соусом',cat:'Основные блюда',time:'1,5 часа',serv:4,yield:1270,photo:'img/17.jpg',

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmtN(v){return String(v).replace('.',',')}
function parseQty(q){
 if(q==null)return null;
 if(typeof q==='number')return q;
 let s=q;
 for(const f in FS){s=s.split(f).join('+'+FS[f])}
 const seg=s.split(/[–—-]/);
 const one=t=>{let m=t.match(/\d+(?:[.,]\d+)?/g);if(!m)return null;let sum=0;for(const x of m)sum+=parseFloat(x.replace(',','.'));return sum};
 const vals=seg.map(one);
 if(vals.length>1)return{lo:vals[0],hi:vals[1]};
 return vals[0];
}
function smartRound(v){
 if(v<=0)return 0;
 if(v<1)return Math.round(v*4)/4;
 if(v<10)return Math.round(v*2)/2;
 if(v<100)return Math.round(v);
 return Math.round(v/5)*5;
}
function fmtQ(v){
 if(Math.abs(v-Math.round(v))<1e-9)return String(Math.round(v));
 if(v<1){const m={'0.25':'¼','0.5':'½','0.75':'¾'};const k=v.toFixed(2);if(m[k])return m[k];if(Math.abs(v-1/3)<0.05)return '⅓';if(Math.abs(v-2/3)<0.05)return '⅔';return fmtN(+v.toFixed(2))}
 return fmtN(+v.toFixed(2));
}
function scaleQty(q,k){

function dbKey(name){

function gramsOf(name,q,u){
 const p=parseQty(q);
 const v=p==null?0:(typeof p==='object'?(p.lo+p.hi)/2:p);
 if(u==='г'||u==='мл')return v;
 if(u==='кг')return v*1000;
 const n=name.toLowerCase();
 if(u==='зубчик')return v*6;

 h+='<span class="lbl">итог: ×'+fmtN(+k.toFixed(2))+'</span></div>';
 for(const pt of r.parts){
  h+='<div class="ph">'+esc(pt.n)+'</div>';
  for(const[n,q,u]of pt.it){
   const sq=scaleQty(q,k);
   h+='<div class="pi">'+esc(n)+' — '+(sq==null?'по вкусу':sq+' '+esc(u))+'</div>';
  }
  if(pt.st)h+='<div class="pi" style="color:#8a7d6b;font-size:13px">'+esc(pt.st)+'</div>';
 }
 h+='<div class="ph">Способ приготовления</div><ol class="steps">'+r.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
 h+='<div class="btnrow"><button class="btn" onclick="showPrint('+r.id+')">Распечатать рецепт</button><button class="btn sec" onclick="closeM()">Закрыть</button></div>';
 document.getElementById('modal').innerHTML=h;
if(f==='c'||f==='g'){const el=document.getElementById(f==='c'?'inpC':'inpG');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}
const P1=75,P0=190;
function blocks(r,k){
 const bl=[];
 for(const pt of r.parts){
  bl.push({t:'h',x:pt.n,h:9});
  for(const[n,q,u]of pt.it){
   const sq=scaleQty(q,k);
   bl.push({t:'i',x:esc(n)+' — '+(sq==null?'по вкусу':sq+' '+esc(u)),h:6.3});
  }
  if(pt.st)bl.push({t:'i',x:'<i>'+esc(pt.st)+'</i>',h:6.3});
 }
 bl.push({t:'h',x:'Способ приготовления',h:9});
 r.steps.forEach((x,i)=>bl.push({t:'i',x:(i+1)+'. '+esc(x),h:7}));
 if(r.perPart){
  bl.push({t:'h',x:'КБЖУ начинок (на 100 г, примерно)',h:9});
  for(const pt of r.parts.slice(1)){
   const d=partNutr(pt.it);
   bl.push({t:'i',x:esc(pt.n)+': '+Math.round(d.k/d.w*100)+' ккал · Б '+Math.round(d.p/d.w*100)+' · Ж '+Math.round(d.f/d.w*100)+' · У '+Math.round(d.c/d.w*100),h:6.3});
  }
 }
 return bl;
}
function paginate(r,k){
 const s=recipeNutr(r);
 const nutrMm=r.perPart?r.parts.length*7+20:34;
 const bl=blocks(r,k);
 const pages=[];let b=P1-nutrMm;let pg=[];
 for(const x of bl){if(x.h>b){pages.push(pg);pg=[];b=P0;}pg.push(x);b-=x.h}
 pages.push(pg);
 return pages;
}
function pageHTML(pg,first,cont,r){
 let h='<div class="sheet sh"><div class="phh" style="font-size:11px">'+(cont?esc(r.t)+' · — продолжение —':esc(r.cat))+'</div>';
 if(first){
  h+='<h3>'+esc(r.t)+'</h3><div class="sm">'+esc(r.time)+' · порций: '+Math.round(r.serv*getK(r.id)*10)/10+'</div>';
  h+='<div style="height:48mm;overflow:hidden;margin:3mm 0">'+photoTagH(r)+'</div>';
  const s=recipeNutr(r);
  if(r.perPart){
   h+='<table class="n"><tr><th>Начинка</th><th>ккал/100 г</th></tr>';
   for(const pt of r.parts.slice(1)){const d=partNutr(pt.it);h+='<tr><td>'+esc(pt.n)+'</td><td>'+Math.round(d.k/d.w*100)+'</td></tr>'}
   h+='</table><div class="nn">Примерный КБЖУ по сырому весу с учётом уварки. Готовый вес ≈ '+r.yield+' г.</div>';
  }else{
   h+='<table class="n"><tr><th></th><th>ккал</th><th>Б</th><th>Ж</th><th>У</th></tr>';
   h+='<tr><td>на 100 г готового</td><td>'+Math.round(s.k/r.yield*100)+'</td><td>'+Math.round(s.p/r.yield*100)+'</td><td>'+Math.round(s.f/r.yield*100)+'</td><td>'+Math.round(s.c/r.yield*100)+'</td></tr>';
   h+='<tr><td>на порцию</td><td>'+Math.round(s.k/r.serv)+'</td><td>'+Math.round(s.p/r.serv)+'</td><td>'+Math.round(s.f/r.serv)+'</td><td>'+Math.round(s.c/r.serv)+'</td></tr>';
   h+='</table><div class="nn">Примерный расчёт по сырому весу с учётом уварки.</div>';
  }
 }
 for(const x of pg){
  h+=x.t==='h'?'<div class="phh">'+x.x+'</div>':'<div class="itm">'+x.x+'</div>';
 }
 h+='<div class="cont">'+r.id+'</div>';
 for(const y of HOLES){h+='<div class="hole" style="top:'+y+'mm"></div>'}
 h+='</div>';
 return h;
}
function showPrint(id){
 const r=R.find(x=>x.id===id),k=getK(id);
 const pages=paginate(r,k);
 let h='<div class="btnrow"><button class="btn" onclick="window.print()">Печать</button><button class="btn sec" onclick="closeP()">Закрыть</button></div><div class="sheetwrap">';
 pages.forEach((pg,i)=>{h+='<div>'+pageHTML(pg,i===0,i>0,r)+'</div>'});
 h+='</div>';
 openPrev(h);
}
function printBook(){
 let h='<div class="btnrow"><button class="btn" onclick="window.print()">Печать книги</button><button class="btn sec" onclick="closeP()">Закрыть</button></div><div class="sheetwrap">';
 for(const r of R){
  const pages=paginate(r,1);
  pages.forEach((pg,i)=>{h+='<div>'+pageHTML(pg,i===0,i>0,r)+'</div>'});
  if(pages.length%2===1)h+='<div class="sheet"></div>';
 }
 h+='</div>';
 openPrev(h);
}
function openPrev(inner){
 document.getElementById('prevInner').innerHTML=inner+'<div class="btnrow"><button class="btn" onclick="window.print()">Печать</button><button class="btn sec" onclick="closeP()">Закрыть</button></div>';
 document.getElementById('prev').classList.add('open');
 window.scrollTo(0,0);
}
function closeP(){document.getElementById('prev').classList.remove('open')}
renderCats();renderGrid();
</script>
</body>
