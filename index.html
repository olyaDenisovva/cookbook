  .contnote{font-family:Arial,sans-serif;font-size:8.5pt;color:#8a7a63;margin-bottom:3mm}

let cur = null, curK = 1;

const HOLES = [27.5, 72.5, 137.5, 182.5];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderChips(){
  const box = document.getElementById('chips');
  let h = '<button class="chip on" data-act="filter" data-cat="all">Все</button>';
  DATA.cats.forEach(c=>{h += '<button class="chip" data-act="filter" data-cat="'+c+'">'+DATA.catIcon[c]+' '+c+'</button>';});
  box.innerHTML = h;
}

function partsLabel(r){
  if(r.parts.length===1) return 'базовый рецепт';
  if(r.id===18) return r.parts.length-1 + ' начинок';
  return r.parts.length + ' части';
}

function renderGrid(cat){
  const g = document.getElementById('grid');
  let h = '';
  DATA.recipes.filter(r=>cat==='all'||r.cat===cat).forEach(r=>{
    h += '<div class="card" data-act="open" data-id="'+r.id+'">'
      + '<div class="ph" data-id="'+r.id+'"><span class="em">'+r.emoji+'</span>'
      + '<img src="img/'+r.photo+'.jpg" alt="" data-id="'+r.id+'">'
      + '<span class="badge">'+esc(r.cat)+'</span></div>'
      + '<div class="cbody"><h3>'+esc(r.name)+'</h3>'
      + '<div class="cmeta"><span>⏱ '+esc(r.time)+'</span><span>'+partsLabel(r)+'</span></div>'
      + '<div class="ckbju">≈ '+r.per100.k+' ккал / 100 г</div>'
      + '<button class="mopen" data-act="open" data-id="'+r.id+'">Открыть полностью</button>'
      + '</div></div>';
  });
  g.innerHTML = h;
  g.querySelectorAll('img').forEach(img=>{
    img.onerror = ()=>{ img.closest('.ph').classList.add('noimg'); img.closest('.mphoto')&&img.closest('.mphoto').classList.add('noimg'); };
  });
}

function fmtNum(x){
  if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x));
  const map={0.25:'¼',0.5:'½',0.75:'¾'};
  const r1=Math.round(x*4)/4;
  if(Math.abs(r1-Math.round(r1))>1e-9 && map[String(r1)]) return map[String(r1)];
  const whole=Math.floor(r1), frac=r1-whole;
  if(frac>0 && map[frac.toFixed(2)]) return (whole? whole+'':'')+map[frac.toFixed(2)];
  return String(r1).replace('.',',');
}

function smartRound(x){
  if(x<=2) return Math.round(x*4)/4;
  if(x<=12) return Math.round(x*2)/2;
  if(x<=60) return Math.round(x);
  if(x<=200) return Math.round(x/5)*5;
  return Math.round(x/10)*10;
}

function qtyStr(it,k){
  if(it.q===null||it.u===null) return '';
  const f=(v)=>fmtNum(smartRound(v*k));
  const a=f(it.q);
  if(it.q2!==null){
    const b=f(it.q2);
    return a===b? a : a+'–'+b;
  }
  return a;
}

function kbjuBlock(r,k){
  const tot = Math.round(r.total*k);
  return '<div class="kbju"><h4>Примерный КБЖУ</h4><table>'
    + '<tr><th></th><th>ккал</th><th>Б, г</th><th>Ж, г</th><th>У, г</th></tr>'
    + '<tr><td>на 100 г</td><td>'+r.per100.k+'</td><td>'+r.per100.p+'</td><td>'+r.per100.f+'</td><td>'+r.per100.c+'</td></tr>'
    + '<tr><td>на порцию</td><td>'+r.perPortion+'</td><td>—</td><td>—</td><td>—</td></tr>'
    + '<tr><td>на всё блюдо'+(k!==1?' (×'+fmtNum(k)+')':'')+'</td><td>'+tot+'</td><td>—</td><td>—</td><td>—</td></tr>'
    + '</table><div class="note">Готовый вес блюда ≈ '+fmtNum(r.ready*k)+' г. Расчёт по сырым ингредиентам с учётом уварки/выпаривания (−'+Math.round(r.loss*100)+'%). Значения ориентировочные.</div></div>';
}

function ingredientsHtml(r,k){
  return r.parts.map(p=>{
    const head = p.title? '<h4>'+esc(p.title)+'</h4>':'';
    const lis = p.items.map(it=>{
      const q = qtyStr(it,k);
      const name = (it.q===null||it.u===null)? esc(it.n) : esc(it.n);
      return '<li>'+(q? '<span class="q">'+q+'</span> ':'')+name+'</li>';
    }).join('');
    return head+'<ul>'+lis+'</ul>';
  }).join('');
}

function openRecipe(id){
  cur = DATA.recipes.find(x=>x.id===Number(id)); curK = 1;
  const r = cur;
  document.getElementById('mbox').innerHTML =
    '<button class="mclose" data-act="close">✕</button>'
    + '<div class="mhead">'
    + '<div class="mphoto" id="mphoto"><span class="em">'+r.emoji+'</span><img src="img/'+r.photo+'.jpg" alt=""></div>'
    + '<div class="mtitle"><h2>'+esc(r.name)+'</h2>'
    + '<div class="cmeta"><span>⏱ '+esc(r.time)+'</span><span>'+partsLabel(r)+'</span><span>базовых порций: '+r.portions+'</span></div>'
    + '<div class="portions"><div class="lbl">Порции:</div>'
    + '<button class="pbtn" data-act="k" data-k="0.5">½</button>'
    + '<button class="pbtn on" data-act="k" data-k="1">1</button>'
    + '<button class="pbtn" data-act="k" data-k="2">2</button>'
    + '<button class="pbtn" data-act="k" data-k="3">3</button>'
    + '<button class="pbtn" data-act="k" data-k="4">4</button>'
    + '<input class="pinp" id="pCount" type="number" step="0.5" min="0.25" value="1" title="своё число порций">'
    + '<input class="pinp" id="pGrams" type="number" step="10" min="0" value="'+r.ready+'" title="вес готового блюда, г">'
    + '<div class="lbl" style="margin-top:4px">слева — своё число порций, справа — вес готового блюда, г</div>'
    + '</div></div></div>'
    + '<div class="igr" id="igr">'+ingredientsHtml(r,1)+'</div>'
    + '<div class="steps">'+r.steps.map(s=>'<p>'+esc(s)+'</p>').join('')+'</div>'
    + '<div id="kbjuBox">'+kbjuBlock(r,1)+'</div>'
    + '<button class="printbtn" data-act="printr">🖨 Распечатать рецепт</button>';
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('mphoto').querySelector('img').onerror = function(){ this.closest('.mphoto').classList.add('noimg'); };
  const pc = document.getElementById('pCount'), pg = document.getElementById('pGrams');
  pc.addEventListener('input', ()=>{ const v=parseFloat(pc.value); if(v>0) setK(v); });
  pg.addEventListener('input', ()=>{ const v=parseFloat(pg.value); if(v>0) setK(v/r.ready); });
}

function setK(k){
  if(!cur) return;
  curK = k;
  document.getElementById('igr').innerHTML = ingredientsHtml(cur,k);
  document.getElementById('kbjuBox').innerHTML = kbjuBlock(cur,k);
  document.querySelectorAll('.pbtn').forEach(b=>{
    b.classList.toggle('on', Math.abs(parseFloat(b.dataset.k)-k)<0.01);
  });
  const pc=document.getElementById('pCount'), pg=document.getElementById('pGrams');
  if(document.activeElement!==pc) pc.value = (Math.round(k*100)/100);
  if(document.activeElement!==pg) pg.value = Math.round(cur.ready*k);
}

function sheetHoles(){
  return HOLES.map(t=>'<div class="hole" style="top:'+t+'mm"></div>').join('');
}

function kbjuLine(r,k){
  return 'КБЖУ на 100 г ≈ '+r.per100.k+' ккал (Б '+r.per100.p+' · Ж '+r.per100.f+' · У '+r.per100.c+') · на порцию ≈ '+r.perPortion+' ккал · примерный расчёт по сырым ингредиентам с учётом уварки';
}

function sheetHtml(r,k,page){
  let h = '<div class="sheet">'+sheetHoles();
  if(page===0){
    h += '<h2>'+esc(r.name)+'</h2>'
      + '<div class="smeta">⏱ '+esc(r.time)+' · '+partsLabel(r)+' · <b>🍴 '+fmtNum(k)+' порции</b></div>'
      + '<div class="igr">'+ingredientsHtml(r,k)+'</div>';
  } else {
    h += '<div class="contnote">'+esc(r.name)+' — продолжение, стр. '+(page+1)+'</div>';
  }
  h += '<div class="steps">'+r.steps.map(s=>'<p>'+esc(s)+'</p>').join('')+'</div>';
  h += '<div class="kbjuline">'+kbjuLine(r,k)+'</div></div>';
  return h;
}

function paginate(){
  const area = document.getElementById('printArea');
  Array.from(area.querySelectorAll('.sheet')).forEach(sh=>{
    let guard = 0;
    while(sh.scrollHeight > sh.clientHeight + 2 && guard < 40){
      guard++;
      const box = sh.querySelector('.steps');
      if(!box || !box.lastElementChild) break;
      const name = sh.dataset.name || '';
      const cont = document.createElement('div');
      cont.className = 'sheet';
      cont.innerHTML = sheetHoles()
        + '<div class="contnote">' + esc(name) + ' — продолжение</div>'
        + '<div class="steps"></div>';
      sh.after(cont);
      while(box.lastElementChild && (sh.scrollHeight > sh.clientHeight + 2)){
        cont.querySelector('.steps').insertBefore(box.lastElementChild, cont.querySelector('.steps').firstChild);
      }
      if(!box.lastElementChild) break;
      sh = cont;
    }
  });
}

function printRecipe(id){
  const r = DATA.recipes.find(x=>x.id===Number(id));
  const area = document.getElementById('printArea');
  area.innerHTML = sheetHtml(r,curK,0);
  const sh = area.querySelector('.sheet');
  sh.dataset.name = r.name; sh.dataset.k = curK;
  paginate();
  paginate();
  window.print();
}

function printBook(){
  const area = document.getElementById('printArea');
  let h = '<div class="sheet cover">'+sheetHoles()
    + '<div class="decor">📖</div><div class="big">Кулинарная книга</div>'
    + '<div class="small">Домашние рецепты</div></div>';
  DATA.recipes.forEach(r=>{
    h += sheetHtml(r,1,0);
  });
  area.innerHTML = h;
  area.querySelectorAll('.sheet').forEach((sh,idx)=>{
    if(idx===0) return;
    const r = DATA.recipes[idx-1];
    sh.dataset.name = r.name; sh.dataset.k = 1;
  });
  paginate();
  window.print();
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(act==='filter'){
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===b));
    renderGrid(b.dataset.cat);
  } else if(act==='open'){
    openRecipe(b.dataset.id);
  } else if(act==='close'){
    document.getElementById('modal').classList.add('hidden');
  } else if(act==='k'){
    setK(parseFloat(b.dataset.k));
  } else if(act==='printbook'){
    printBook();
  } else if(act==='printr'){
    printRecipe(b.dataset.id);
  }
});

renderChips();
renderGrid('all');
</script>
